# ==============================================================================
# Clean-Room SQLFlow 8.2.2.15 On-Premise Configuration (gudu_sqlflow.conf)
# Loaded by unified server / gateway & service components from ../conf/gudu_sqlflow.conf
# ==============================================================================

# Master deployment mode ("premise" enables on-premise WebUrlFilter & local auth)
deployment=premise

# Default system administrator email
default_admin_email=admin@sqlflow.com

# Lineage complexity & simplification thresholds
relation_limit=1000
relation_try_simple_limit=20000
big_sql_size=4096
disable_visualize_join=false

# Execution parallelism & file splitting
parallel=2
split_sql_size=5
min_parallel_sql_size=10
max_parallel_task=3
dataflow_graph_timeout=120000

# Job retention & SQL audit logging
job_reserve_period=180
record_sql=false
base_sql_log_dir=/wings/logs/sqlflow_logs
export_include_transform=false

# Authentication, anonymous rate limit, & CORS
# NOTE: Shipped default is false so @UserValidate actively checks userId + token
ignore_user_token=false
anonymous_sql_Execute_limit=50
cros.allowedOrigins=*

# Unified HTTP server port & legacy internal Eureka compatibility settings
server_port=8165
eureka_host=localhost
eureka_port=8761
eureka_username=admin
eureka_password=sqlflow123

# Clean-room on-premise edition metadata (zero proprietary secrets)
edition=on-premise
customer_company_name=SQLFlow On-Premise
customer_contact_name=Administrator
customer_contact_email=admin@sqlflow.com
license_expired=2099-12-31
license_max_users=unlimited

# Optional overrides (uncomment to customize)
#jwk_set_server=http://127.0.0.1:9001
#user_token_expire_hours=24
#password_security_validate=true
#ENABLE_INTERPRETER=false
#REDSHIFT_ENABLE_BRACKET_NAME=false
#anonymous_user_id=gudu|0123456789
