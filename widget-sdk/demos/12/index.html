<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo 12 — Custom Theme, Visibility Toggles &amp; ResizeObserver · SQLFlow Widget SDK 3.6.16</title>
  <link rel="stylesheet" href="../sqlflow.widget.3.6.16.css" />
  <link rel="stylesheet" href="../fixtures/demo-common.css" />
</head>
<body>
  <div class="demo-page">
    <div class="demo-header">
      <div class="demo-header-left">
        <a class="demo-portal-link" href="../index.html">← All Demos</a>
        <span class="demo-badge">Demo 12</span>
        <h1 class="demo-title">Live Theme, Visibility Toggles &amp; Responsive Container Resize</h1>
      </div>
      <span class="demo-api-pill">setOptions({ theme, editor, toolbar, minimap, ... })</span>
    </div>

    <div class="demo-controls">
      <button id="theme-toggle-btn" class="demo-btn demo-btn-primary" type="button">Theme: Dark</button>
      <label><input type="checkbox" data-vis="toolbar" checked /> Toolbar</label>
      <label><input type="checkbox" data-vis="editor" checked /> Editor</label>
      <label><input type="checkbox" data-vis="minimap" checked /> Minimap</label>
      <label><input type="checkbox" data-vis="search" checked /> Search</label>
      <label><input type="checkbox" data-vis="settings" checked /> Settings</label>
      <label><input type="checkbox" data-vis="export" checked /> Export</label>
      <label><input type="checkbox" data-vis="scaleControls" checked /> Zoom Bar</label>
      <select id="size-preset" class="demo-select">
        <option value="100%:100%">Size: Full Fluid (100% × 100%)</option>
        <option value="920px:500px">Size: Compact Card (920 × 500)</option>
        <option value="720px:420px">Size: Embedded Tile (720 × 420)</option>
      </select>
    </div>

    <div class="demo-body" style="align-items:center;justify-content:center;background:#1e293b;padding:12px;">
      <div id="sqlflow" style="width:100%;height:100%;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.35);"></div>
    </div>
  </div>

  <script src="../sqlflow.widget.3.6.16.js"></script>
  <script src="../fixtures/shared-demo-data.js"></script>
  <script src="./index.js"></script>
</body>
</html>
