<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQLFlow Shared Lineage Snapshot Viewer</title>
  <link rel="stylesheet" href="../sqlflow.widget.3.6.16.css" />
  <link rel="stylesheet" href="../fixtures/demo-common.css" />
</head>
<body>
  <div class="demo-page">
    <div class="demo-header">
      <div class="demo-header-left">
        <a class="demo-portal-link" href="../index.html">← All Demos</a>
        <span class="demo-badge">Share</span>
        <h1 class="demo-title">Read-Only Shared Lineage Snapshot Viewer</h1>
      </div>
      <span class="demo-api-pill">visualizeShare: true</span>
    </div>
    <div class="demo-body">
      <div id="sqlflow" class="demo-widget-host"></div>
    </div>
  </div>
  <script src="../sqlflow.widget.3.6.16.js"></script>
  <script src="../fixtures/shared-demo-data.js"></script>
  <script>
    (async function () {
      var params = new URLSearchParams(window.location.search);
      var shareId = params.get("shareId") || "";
      var widget = await window.SQLFlow.init({
        container: "#sqlflow",
        visualizeShare: true,
        shareId: shareId || undefined,
        minimap: true,
        search: true
      });
      window.sqlflowWidget = widget;
      if (!shareId) {
        await widget.visualizeJson(window.SQLFlowDemoFixtures.ECOMMERCE_LINEAGE_JSON);
      }
    })();
  </script>
</body>
</html>
