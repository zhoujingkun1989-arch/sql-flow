<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo 1 — Core SQL Visualization · SQLFlow Widget SDK 3.6.16</title>
  <link rel="stylesheet" href="../sqlflow.widget.3.6.16.css" />
  <link rel="stylesheet" href="../fixtures/demo-common.css" />
</head>
<body>
  <div class="demo-page">
    <div class="demo-header">
      <div class="demo-header-left">
        <a class="demo-portal-link" href="../index.html">← All Demos</a>
        <span class="demo-badge">Demo 1</span>
        <h1 class="demo-title">Core SQL Visualization Across Dialects</h1>
      </div>
      <span class="demo-api-pill">SQLFlow.init(...) · visualizeSQL(sql, vendor)</span>
    </div>

    <div class="demo-controls">
      <label for="dialect-select">Dialect:</label>
      <select id="dialect-select" class="demo-select">
        <option value="snowflake">Snowflake</option>
        <option value="oracle">Oracle</option>
        <option value="postgresql" selected>PostgreSQL</option>
        <option value="bigquery">BigQuery</option>
        <option value="mysql">MySQL</option>
        <option value="mssql">SQL Server</option>
      </select>
      <button id="run-sql-btn" class="demo-btn demo-btn-primary" type="button">Visualize SQL</button>
      <button id="toggle-editor-btn" class="demo-btn" type="button">Toggle Built-in Editor</button>
      <span id="demo1-status" class="demo-status">Initializing...</span>
    </div>

    <div class="demo-body">
      <div class="demo-sidebar">
        <strong>Host SQL Input</strong>
        <textarea id="sql-input" class="demo-textarea" style="flex:1;min-height:260px;"></textarea>
      </div>
      <div id="sqlflow" class="demo-widget-host"></div>
    </div>
  </div>

  <script src="../sqlflow.widget.3.6.16.js"></script>
  <script src="../fixtures/shared-demo-data.js"></script>
  <script src="./index.js"></script>
</body>
</html>
