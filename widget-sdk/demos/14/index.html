<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo 14 — Join Analysis &amp; Diagnostics · SQLFlow Widget SDK 3.6.16</title>
  <link rel="stylesheet" href="../sqlflow.widget.3.6.16.css" />
  <link rel="stylesheet" href="../fixtures/demo-common.css" />
</head>
<body>
  <div class="demo-page">
    <div class="demo-header">
      <div class="demo-header-left">
        <a class="demo-portal-link" href="../index.html">← All Demos</a>
        <span class="demo-badge">Demo 14</span>
        <h1 class="demo-title">SQL Join Analysis &amp; Cardinality / Anti-Pattern Diagnostics</h1>
      </div>
      <span class="demo-api-pill">visualizeJoin(sql, vendor) · join-analysis.v1</span>
    </div>

    <div class="demo-controls">
      <select id="join-vendor" class="demo-select">
        <option value="postgresql" selected>PostgreSQL</option>
        <option value="snowflake">Snowflake</option>
        <option value="oracle">Oracle</option>
      </select>
      <button id="run-join-btn" class="demo-btn demo-btn-primary" type="button">Analyze Joins</button>
      <span id="join-status" class="demo-status">Ready</span>
    </div>

    <div class="demo-body">
      <div class="demo-sidebar">
        <strong>Multi-Join SQL Query</strong>
        <textarea id="join-sql" class="demo-textarea" style="flex:1;min-height:260px;"></textarea>
      </div>
      <div id="sqlflow" class="demo-widget-host"></div>
    </div>
  </div>

  <script src="../sqlflow.widget.3.6.16.js"></script>
  <script src="../fixtures/shared-demo-data.js"></script>
  <script src="./index.js"></script>
</body>
</html>
